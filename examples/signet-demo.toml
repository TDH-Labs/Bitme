# Demo config for manual testing against a signet node. These are throwaway test keys
# (deterministic dummy seeds), NOT real wallet keys - do not use for anything but local testing.
network = "signet"
timelock_blocks = 4320          # ~30 days. See README: this is a CONSENSUS rule baked
                                # into the address, so changing it later needs an on-chain sweep.

[keys.satochip]
master_fingerprint = "4ba43603"
derivation_path = "48h/1h/0h/2h"
xpub = "tpubDDwf2gdFxFahr9RUtDQCuZmsx34CfdZ7RALAirwC2FGeLBzW1TDiEpqFeRdxLdZD7rfsbZHYwSaT6CLM3TAcYRw6xfRv4U6KCQt4Zuhvjkz"

[keys.server]
master_fingerprint = "8dfc9b34"
derivation_path = "48h/1h/0h/2h"
xpub = "tpubDEXiq2SVhhqALktxfVFgj3C9M3T2G7xL11iezYg2LJAf245YkNyqp2K9TrvHABDCp2232k34UegU4aKEtUZNigit8EEqoLNe2JKMzMiLwYq"

[keys.mobile]
master_fingerprint = "56c4fac3"
derivation_path = "48h/1h/0h/2h"
xpub = "tpubDEg3kqr2jo5ergkJbFqRHvCpiob7wR7Hi44J7y987G1JZfbzBND77XKTyPZzGvh3uyDf8kexMJnFD9W8FuraJ4wLMsx6YuZVXRSRRcx6QdD"

# Required to run `cosigner serve`. The descriptor CLI (`descriptor build`/`descriptor check`)
# doesn't need any of the sections below.
[bitcoind]
rpc_url = "http://127.0.0.1:38332"
rpc_cookie_file = "/home/bitcoin/.bitcoin/signet/.cookie"
# rpc_user / rpc_password instead, if not using a cookie file - not both.

[server]
bind_addr = "127.0.0.1:8080"   # loopback by default - this service holds one of three keys
gap_limit = 1000
ledger_db_path = "/var/lib/cosigner/ledger.sqlite3"

# Required for /sign_psbt. Point at a file or an env var holding the SERVER account-level
# xprv (at keys.server.derivation_path) - never put key material directly in this file.
[server_signing]
xprv_file = "/etc/cosigner/server.xprv"
# xprv_env_var = "COSIGNER_SERVER_XPRV"  # instead of xprv_file - not both.

# Every /sign_psbt spend is checked against these caps before it's even queued for signing,
# and again (against whatever the rolling totals are by then) right before it's actually
# signed - see src/policy.rs and src/sign.rs. Above-threshold spends are refused outright;
# there is no override.
#
# This section is only ever consulted once: the first time this service ever starts against a
# fresh ledger database, its values are copied in as policy version 1. Every start after that
# reads the current policy straight from the database instead - the values below are ignored,
# and the only way to change the running policy from then on is a SATOCHIP-authorized
# POST /policy (see src/policy_auth.rs and `cosigner policy message --help`).
[policy]
max_tx_sat = 500000           # 0.005 BTC per transaction
max_daily_sat = 1000000       # 0.01 BTC per trailing 24h
max_weekly_sat = 3000000      # 0.03 BTC per trailing 7d
max_monthly_sat = 8000000     # 0.08 BTC per trailing 30d
max_fee_sat = 50000
max_fee_rate_sat_per_vb = 200.0
# destination_whitelist = ["tb1q..."]  # optional; omit to allow any destination

# Required for /sign_psbt. An approved spend is never signed on the spot: it's queued, a
# notification is sent over every channel configured below, and only actually signed once
# hold_seconds has passed with no POST /veto/{id} - see src/notify.rs and src/sign.rs.
[notify]
hold_seconds = 900            # 15 minutes to review and veto before this service signs
sweep_interval_seconds = 5
renotify_interval_seconds = 21600  # remind every 6h while a spend is still holding    # how often the background sweeper checks for elapsed holds

[notify.ntfy]
url = "https://ntfy.sh/replace-with-a-private-topic-name"
# auth_token = "..."          # optional, for a self-hosted ntfy server requiring auth

# [notify.smtp]                # optional second (or alternative) channel; both may be set
# host = "smtp.example.com"
# port = 587
# username = "cosigner@example.com"
# password = "..."
# from = "cosigner@example.com"
# to = "you@example.com"

# The MOBILE + SERVER path - what you use if the SATOCHIP is lost or destroyed. Its own
# settings because a full-balance sweep is the legitimate use, so [policy]'s per-transaction
# and rolling caps would block precisely what it's for.
#
# IMPORTANT: older(N) is a *relative* timelock. Coins already older than timelock_blocks
# satisfy it right now, so for a mature wallet hold_seconds below is the PRIMARY protection
# against a stolen phone, not a backstop. Keep it long, and set the whitelist if you can.
[recovery]
enabled = true                  # off would make lost-SATOCHIP recovery impossible by default
hold_seconds = 172800           # 48h of notify-and-veto before a no-hardware spend is signed
# destination_whitelist = ["tb1q..."]  # strongly recommended: pre-commit to where you'd sweep

# Optional alternate front door for the same HTTP API, over Nostr NIP-17 private messages
# instead of an open port - no inbound port, no domain, no certificate. Every message's sender
# is cryptographically verified before allowed_npubs is even consulted; removing an npub here
# is how a lost or stolen device is cut off.
# [nostr_transport]
# nsec_env_var = "COSIGNER_NOSTR_NSEC"
# relays = ["wss://relay.damus.io", "wss://nos.lol", "wss://relay.snort.social"]
# allowed_npubs = ["npub1..."]  # one entry per device allowed to submit requests
