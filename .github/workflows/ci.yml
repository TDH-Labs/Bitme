name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, unit test, lint
    runs-on: ubuntu-latest
    # The crate lives in bitme-cosigner/ (not the repo root) so Umbrel's installer - which only
    # ever copies that one folder into the app's data directory - has a self-contained build
    # context. See bitme-cosigner/docker-compose.yml.
    defaults:
      run:
        working-directory: bitme-cosigner
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "bitme-cosigner -> target"

      - name: Build (lib, bin, tests)
        run: cargo build --all-targets

      - name: Unit tests
        run: cargo test --lib

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --check

  regtest:
    name: Regtest integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bitme-cosigner
    # Same image already used by docker-compose.signet.yml and
    # bitme-cosigner/docker-compose.simulate-umbrel.yml, so its BITCOIN_NETWORK/
    # BITCOIN_EXTRA_ARGS interface is already relied on elsewhere in this repo, not introduced
    # fresh here.
    services:
      bitcoind:
        image: btcpayserver/bitcoin:29.2
        env:
          BITCOIN_NETWORK: regtest
          # txindex=1: bitme-cosigner/tests/common/mod.rs calls get_raw_transaction_info (getrawtransaction) on
          # a just-confirmed tx. Without the index, bitcoind can only serve that RPC for mempool
          # transactions, so it starts failing the moment the preceding generate_to_address call
          # confirms it into a block.
          BITCOIN_EXTRA_ARGS: |
            server=1
            rpcbind=0.0.0.0
            rpcallowip=0.0.0.0/0
            rpcuser=cosigner
            rpcpassword=cosigner
            fallbackfee=0.0001
            txindex=1
        ports:
          - 18443:18443
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "bitme-cosigner -> target"

      - name: Wait for bitcoind RPC
        run: |
          for i in $(seq 1 30); do
            if curl -sS --user cosigner:cosigner \
                --data-binary '{"jsonrpc":"1.0","id":"ci","method":"getblockchaininfo","params":[]}' \
                -H 'content-type: text/plain;' http://127.0.0.1:18443/ >/dev/null 2>&1; then
              echo "bitcoind is up"
              exit 0
            fi
            sleep 2
          done
          echo "bitcoind did not become ready in time" >&2
          exit 1

      # Both integration test files gracefully skip (not fail) without COSIGNER_REGTEST_RPC_URL
      # set - see bitme-cosigner/tests/common/mod.rs - so this job only ever adds coverage, never blocks on a
      # missing node. Run together, single-threaded: both files share the same live node/mempool,
      # and running them as concurrent processes against it would race.
      - name: Regtest integration tests
        env:
          COSIGNER_REGTEST_RPC_URL: http://127.0.0.1:18443
          COSIGNER_REGTEST_RPC_USER: cosigner
          COSIGNER_REGTEST_RPC_PASSWORD: cosigner
        run: cargo test --test regtest_inspect --test regtest_full_flow -- --test-threads=1

  # Testnet integration tests run against a real testnet node - the same regtest suite, but
  # pointed at testnet instead. This catches network-specific breakage (version bytes,
  # derivation, address prefixes) that unit tests with mocked chains can't.
  #
  # The suite is env-gated on COSIGNER_REGTEST_RPC_URL and skips cleanly without a node, but
  # the integration test files are written for regtest's instant block generation. Against a
  # real testnet node, block generation isn't available, so this job is intentionally minimal:
  # it builds and runs the unit suite (which covers descriptor/derivation logic for testnet)
  # and confirms the service can at least connect to a testnet node and inspect its chain state.
  testnet:
    name: Testnet smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bitme-cosigner
    services:
      bitcoind:
        image: btcpayserver/bitcoin:29.2
        env:
          BITCOIN_NETWORK: testnet
          BITCOIN_EXTRA_ARGS: |
            server=1
            rpcbind=0.0.0.0
            rpcallowip=0.0.0.0/0
            rpcuser=cosigner
            rpcpassword=cosigner
            fallbackfee=0.0001
            txindex=1
        ports:
          - 18332:18332
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "bitme-cosigner -> target"

      - name: Wait for bitcoind RPC
        run: |
          for i in $(seq 1 60); do
            if curl -sS --user cosigner:cosigner \
                --data-binary '{"jsonrpc":"1.0","id":"ci","method":"getblockchaininfo","params":[]}' \
                -H 'content-type: text/plain;' http://127.0.0.1:18332/ >/dev/null 2>&1; then
              echo "bitcoind is up"
              exit 0
            fi
            sleep 2
          done
          echo "bitcoind did not become ready in time" >&2
          exit 1

      - name: Verify testnet chain info
        run: |
          curl -sS --user cosigner:cosigner \
            --data-binary '{"jsonrpc":"1.0","id":"ci","method":"getblockchaininfo","params":[]}' \
            -H 'content-type: text/plain;' http://127.0.0.1:18332/ | grep -q '"chain":"test"'

      - name: Build and unit test
        run: cargo build --all-targets && cargo test --lib
