manifestVersion: 1
id: bitme-cosigner
name: Bitme Cosigner
tagline: Policy-gated Bitcoin PSBT co-signing service
category: bitcoin
version: "0.1.1"
port: 8080
description: >-
  Self-hosted signing service for a 3-key miniscript wallet (a SATOCHIP smartcard, a Bitcoin
  Keeper mobile app, and this service). It holds one key and co-signs PSBTs only when policy
  allows: per-transaction and rolling day/week/month spend caps, an out-of-band notification
  plus a hold-and-veto window before every signature, and SATOCHIP-authorized runtime policy
  changes. It can never spend alone, never initiates a transaction, and never finalizes or
  broadcasts anything itself.


  This app is API-only by design - it has no web dashboard. Opening it shows a small JSON
  health check, not a page. Everything else happens over its HTTP API; see the project's README
  for the full endpoint reference.


  Start on signet, not mainnet, until you've verified your whole setup end-to-end - see
  docs/UMBREL.md in the repo before installing.
developer: TDH Labs
website: https://github.com/TDH-Labs/Bitme
dependencies:
  - bitcoin
repo: https://github.com/TDH-Labs/Bitme
support: https://github.com/TDH-Labs/Bitme/issues
# Umbrel only auto-resolves icons for apps in its own official store (it falls back to
# umbrel-apps-gallery/<id>/icon.svg, which doesn't exist for community apps), so community
# apps have to point at their icon explicitly. Must be a reachable https URL: umbrelOS's CSP
# is `img-src * blob:`, which permits any host but NOT a data: URI, so the file can't be
# inlined here. This URL requires the repo to stay public - if it goes private the icon 404s
# and the app shows a blank tile, in which case host icon.svg somewhere public and update this.
icon: https://raw.githubusercontent.com/TDH-Labs/Bitme/main/bitme-cosigner/icon.svg
# No screenshots: this is a headless API service, not something with a UI to show.
gallery: []
releaseNotes: >-
  0.1.1: fixes two bugs found installing on real Umbrel hardware that made every install fail -
  a build context that resolved outside this app's folder, and a port variable Umbrel doesn't
  actually export to apps (was left unpublished on a random port instead of 8080). See
  docs/UMBREL.md for details. No functional/wallet-logic changes.


  0.1.0: descriptor construction and invariant verification, PSBT inspection, the policy engine,
  signing, the notify-then-hold-then-veto flow, and SATOCHIP-authorized runtime policy changes.
path: ""
