[package]
name = "cosigner"
version = "0.2.0"
edition = "2021"

[lib]
name = "cosigner"
path = "src/lib.rs"

[[bin]]
name = "cosigner"
path = "src/main.rs"

[dependencies]
age = { version = "0.12.1", features = ["armor"] }
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
bitcoin = { version = "0.32.8", features = ["base64", "secp-recovery"] }
bitcoincore-rpc = "0.19"
clap = { version = "4.6", features = ["derive"] }
http-body-util = "0.1"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
miniscript = { version = "12.3.7", features = ["serde"] }
nostr-sdk = { version = "0.44.1", features = ["nip59"] }
# Renders the finished descriptor as a scannable QR on the setup UI's last screen, so it can
# be carried to a phone without retyping ~300 characters. Pure Rust, no C, SVG output only.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Decodes a QR from an uploaded photo/screenshot, server-side. The browser cannot help here:
# getUserMedia (camera) and BarcodeDetector both require a secure context, and this app is
# reached over plain http on a LAN hostname - so camera scanning is unavailable in practice.
# Decoding an uploaded image works regardless of browser or transport. Both are pure Rust.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rqrr = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1.9"
