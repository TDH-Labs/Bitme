manifestVersion: 1
id: anton
name: Anton
tagline: An AI agent for your small business — schedule, memory, and a governor that asks first
icon: assets/icon.svg
category: automation
version: 0.1.0
port: 3080
description: >-
  Anton is an agent, harnessed: point it at the busywork and it does the
  work itself on its own timer, remembering what it's learned along the
  way. It comes with a schedule it actually keeps (cron + webhooks), a
  memory that sticks (markdown + SQLite second brain), and a governor
  standing between "the agent wants to do this" and "this actually
  happens" — so it never spends money, sends something, or touches a new
  account without you saying go first. All of it lives in one browser
  tab, the Ops Center. Executors (pi / Open Interpreter / host SSH) are
  swappable, and pi (the default) ships in the image ready to do real work
  once you enter a provider API key in the first-run setup wizard.

  Security note: the Ops Center UI itself has no built-in auth, so it never
  binds beyond this container's own loopback interface — a password-gated
  proxy (docker/auth-gate.mjs) is what's actually published on port 3080.
  A login password is generated automatically on first boot and shown once
  on the login page; it's never shown again after your first successful
  login, so save it then (a password manager, or ANTON_WEB_TOKEN to pin a
  known value instead).
developer: TDH Labs
website: https://github.com/TDH-Labs/anton
repo: https://github.com/TDH-Labs/anton
support: https://github.com/TDH-Labs/anton/issues
dependencies: []
gallery: []
releaseNotes: >-
  The Ops Center UI (port 3080) is now reachable directly through a
  password-gated proxy — no SSH tunnel required. pi ships in the image and
  is the default executor; complete the setup wizard with a provider API key
  to do real work. Set ANTON_DASHBOARD_TOKEN before relying on the
  dashboard/API ports directly; choose an executor via ANTON_EXECUTOR
  (fake | pi | oi | ssh).
