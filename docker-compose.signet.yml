# Adds a local signet bitcoind for testing, when you don't already have a node reachable.
# Usage: docker compose -f docker-compose.yml -f docker-compose.signet.yml up -d
#
# Uses btcpayserver/bitcoin (actively maintained, multi-arch: amd64/arm64/armv7 - so this also
# works on ARM self-hosting hardware), configured via its BITCOIN_EXTRA_ARGS convention rather
# than CLI flags - see its entrypoint script for why.
services:
  bitcoind:
    image: btcpayserver/bitcoin:29.2
    restart: unless-stopped
    environment:
      BITCOIN_NETWORK: signet
      BITCOIN_EXTRA_ARGS: |
        server=1
        rpcbind=0.0.0.0
        rpcallowip=0.0.0.0/0
        rpcuser=${BITCOIND_RPC_USER:-cosigner}
        rpcpassword=${BITCOIND_RPC_PASSWORD:-change-me-to-a-real-password}
        fallbackfee=0.0001
    volumes:
      - bitcoind-signet-data:/data
    ports:
      - "38332:38332"   # signet RPC - only exposed to the host for your own debugging;
      - "38333:38333"   #   cosigner reaches this over the compose network, not via these

  cosigner:
    environment:
      BITCOIND_RPC_URL: "http://bitcoind:38332"
      BITCOIND_RPC_USER: "${BITCOIND_RPC_USER:-cosigner}"
      BITCOIND_RPC_PASSWORD: "${BITCOIND_RPC_PASSWORD:-change-me-to-a-real-password}"
    depends_on:
      - bitcoind

volumes:
  bitcoind-signet-data:
