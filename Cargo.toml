[package]
name = "cosigner"
version = "0.1.0"
edition = "2021"

[lib]
name = "cosigner"
path = "src/lib.rs"

[[bin]]
name = "cosigner"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
bitcoin = { version = "0.32.8", features = ["base64"] }
bitcoincore-rpc = "0.19"
clap = { version = "4.6", features = ["derive"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
miniscript = { version = "12.3.7", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1.9"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
